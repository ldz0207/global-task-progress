<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>统一后台任务进度</title><style>
:root{color-scheme:light;--ink:#24382e;--muted:#627267;--green:#196a4c;--line:#dbe4dd}*{box-sizing:border-box}[hidden]{display:none!important}
body{font:15px/1.6 'Segoe UI','Microsoft YaHei',sans-serif;background:#f2f5f3;color:var(--ink);margin:0}main{max-width:1080px;margin:24px auto;padding:22px}
h1{font-size:25px;margin:0}h2{font-size:18px;margin:0}p{margin:10px 0}a{color:var(--green)}small,.muted{color:var(--muted);font-size:12px}
.headerline,.header-right,.current-heading,.taskhead{display:flex;align-items:center;justify-content:space-between;gap:14px}.header-right{gap:16px}.current-heading{margin:26px 0 12px}.current-heading h2{font-size:15px;font-weight:500;color:var(--muted)}
button,select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);padding:5px 10px;cursor:pointer}button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}button:disabled{opacity:.4;cursor:default}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #8fbfaa;outline-offset:3px}.live{font-size:12px;white-space:nowrap;color:var(--green)}.live:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px}#connection.error{color:#9d352a}
.view-options{position:relative}.view-options>summary{list-style:none;cursor:pointer;font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:7px;background:#fff}.view-options>summary::-webkit-details-marker{display:none}.settings-body{position:absolute;right:0;top:38px;width:335px;padding:17px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px #24382e14;z-index:5}
.refresh-control,.taskcontrols{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}.refresh-control input{width:62px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit}.taskcontrols{margin-top:15px}.settings-body .muted{display:block;margin:10px 0 0}#stamp{border-top:1px solid var(--line);padding-top:10px;font-size:11px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:12px 0}.taskhead h2{flex:1;min-width:200px;overflow-wrap:anywhere;font-size:17px}.taskactions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}.badge{display:inline-block;font-size:11px;white-space:nowrap;padding:3px 8px;border-radius:5px;background:#ecf4ea;color:#276342}.badge.attention,.badge.paused{background:#fff2db;color:#815411}.badge.error,.badge.failed{background:#fbe8e5;color:#9d352a}.badge.cancelled,.badge.idle{background:#eff1ef;color:#627267}
.pin,.detail-toggle{font-size:12px;white-space:nowrap}.move-controls{display:inline-flex;gap:4px}.move{min-width:30px;padding:4px 7px;font-size:14px}.summary-hint{color:var(--muted);font-size:12px;margin:10px 0 7px}.countline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}.countline strong{font-size:21px;font-weight:650;font-variant-numeric:tabular-nums}.countline>span{font-size:12px;color:var(--muted)}
progress{display:block;width:100%;height:13px;border:0;border-radius:4px;overflow:hidden;appearance:none;background:#e9eeeb;margin:8px 0 9px}progress::-webkit-progress-bar{background:#e9eeeb}progress::-webkit-progress-value{background:#438765}progress::-moz-progress-bar{background:#438765}
.summary-metrics{display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.summary-metrics .updated{margin-left:auto;font-variant-numeric:tabular-nums}.alert-note{font-size:12px;color:#815411;margin:8px 0 0;overflow-wrap:anywhere}.task-details{margin-top:15px;border-top:1px solid #e6ece7;padding-top:3px}.card.is-compact .task-details{display:none!important}.bulk-details{display:flex;gap:7px;flex-wrap:wrap}.bulk-details button{font-size:12px;padding:4px 9px}
.completed-stages{margin-top:12px}.completed-toggle{font-size:12px;border-color:transparent;background:#f5f8f6;color:var(--muted);padding:5px 9px}.completed-list .tablewrap{margin-top:6px}
.stages>summary{font-size:13px;color:var(--green);cursor:pointer;margin-top:10px}.tablewrap{overflow-x:auto;margin-top:9px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #e6ece7;vertical-align:top}th{font-size:11px;color:var(--muted);font-weight:500}td small{display:block;font-size:11px}td:first-child{min-width:115px}td:nth-child(2){min-width:116px}td:nth-child(3){min-width:100px}td:last-child{min-width:145px}.message{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);font-size:12px}.detail-empty{font-size:12px;color:var(--muted)}
#historyTasks{margin-top:20px}#historyTasks>summary{font-size:13px;color:var(--muted);cursor:pointer;padding:6px 0}#error{background:#fdf1ee;padding:16px;border:1px solid #f0d5ce;border-radius:10px}#emptyCurrent{color:var(--muted);font-size:14px}
@media(max-width:700px){main{margin:10px auto;padding:16px}.taskhead{flex-wrap:wrap}.taskactions{justify-content:flex-start}.card{padding:16px}.summary-metrics{gap:6px 14px}.summary-metrics .updated{margin-left:0}.settings-body{width:min(335px,calc(100vw - 32px))}.current-heading{align-items:flex-start}h1{font-size:23px}}
.overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:24px 0 20px}.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 18px}.tile span{display:block;font-size:12px;color:var(--muted)}.tile strong{font-size:29px;line-height:1.5;font-weight:650;font-variant-numeric:tabular-nums}@media(max-width:700px){.overview{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{padding:12px 14px}}
</style></head><body><main><header class="headerline"><h1>任务进度</h1><div class="header-right"><span class="live" id="connection" role="status">正在连接</span><details id="viewOptions" class="view-options"><summary>设置</summary><div class="settings-body"><form id="refreshForm" class="refresh-control"><label for="refreshSeconds">刷新间隔</label><input id="refreshSeconds" type="number" min="1" max="300" step="1" value="2" required aria-label="自动刷新间隔（秒）"><span>秒</span><button type="submit">应用</button></form><div class="taskcontrols"><label for="taskSort">排序</label><select id="taskSort"><option value="updated">最近更新</option><option value="attention">需要关注优先</option><option value="progress">进度较少优先</option><option value="name">任务名称</option><option value="manual">手动排序</option></select><button type="button" id="clearPins">取消全部置顶</button></div><span class="muted" id="pinHint" aria-live="polite"></span><p class="muted">入口 <a id="progressEndpoint" href="/">当前进度服务</a></p><p class="muted" id="stamp">等待首次刷新</p></div></details></div></header><section class="overview" aria-label="任务概况" id="overview"></section><p id="error" role="status" hidden></p><div id="panels"><section aria-label="当前任务"><div class="current-heading"><h2 id="currentTitle">当前任务</h2><div class="bulk-details"><button type="button" id="expandAllTasks">展开全部</button><button type="button" id="collapseAllTasks">收起全部</button></div></div><div id="currentTasks"></div><p id="emptyCurrent">正在连接</p></section><details id="historyTasks" hidden><summary id="historySummary">历史任务</summary><div id="historyList"></div></details></div></main><script>
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>v==null||v===''||!Number.isFinite(Number(v))?null:Number(v);
const fmt=v=>num(v)==null?'—':Number(v).toLocaleString('zh-CN',{maximumFractionDigits:1});
const labels={running:'进行中',complete:'已完成',attention:'需要核对',error:'异常',failed:'异常',paused:'已暂停',idle:'暂无任务',cancelled:'已取消'};
const status=s=>Object.hasOwn(labels,s)?s:'attention';
const label=s=>labels[status(s)];
const stamp=s=>{if(!s)return '暂无更新';const d=new Date(s);return Number.isNaN(d.getTime())?'暂无更新':d.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})+' 北京时间'};
const duration=v=>{const s=num(v);if(s==null||s<0)return '等待速度测量';if(s===0)return '0 秒';if(s<60)return Math.ceil(s)+' 秒';if(s<3600)return Math.ceil(s/60)+' 分钟';return Math.floor(s/3600)+' 小时 '+Math.ceil(s%3600/60)+' 分钟'};
const halted=s=>['paused','attention','failed','error','cancelled','idle'].includes(s);
function rate(p){
 const s=status(p.status),v=num(p.speed),unit=esc(p.unit||'项');
 if(s==='attention')return '停止测量，需核对';if(s==='paused')return '已暂停';if(s==='failed'||s==='error')return '异常，暂不可测';if(s==='cancelled'||s==='idle')return '未在运行';
 if(v==null)return s==='complete'?'未记录历史速度':'等待测量';if(v===0)return '0 '+unit+'/分钟';
 return (v*60<.1?'&lt;0.1':fmt(v*60))+' '+unit+'/分钟';
}
function eta(p){
 const s=status(p.status);if(s==='complete')return '已完成';if(s==='attention')return '停止估计，需核对进程';if(s==='paused')return '已暂停，恢复后重估';if(s==='failed'||s==='error')return '异常，暂不可估计';if(s==='cancelled'||s==='idle')return '未在运行';
 if(num(p.total)>0&&num(p.done)>=num(p.total))return '当前阶段已完成';return duration(p.eta_seconds);
}
function pct(p){const t=num(p.total),d=num(p.done);return t===0&&d===0?100:t==null||t<0||d==null?null:Math.max(0,Math.min(100,d/t*100))}
function count(p){return num(p.total)!=null&&num(p.total)>=0?fmt(p.done)+' / '+fmt(p.total)+' '+esc(p.unit||'项'):num(p.done)!=null?'已完成 '+fmt(p.done)+' '+esc(p.unit||'项')+' · 总量待确认':'尚无可核实计数'}
function remaining(p){const d=num(p.done),t=num(p.total);return t!=null&&t>=0&&d!=null?fmt(Math.max(0,t-d))+' '+esc(p.unit||'项'):'—'}
function bar(p){const n=pct(p);return n==null?'<small>总量待确认</small>':'<progress value="'+n+'" max="100" aria-label="'+esc(p.stage||'当前阶段')+'进度"></progress>'}
function phases(p){const a=Array.isArray(p.stages)?p.stages:p.stages&&typeof p.stages==='object'?Object.values(p.stages):[];return a.filter(s=>s&&typeof s==='object').map(s=>({...s,historicalFailure:s.stage!==p.stage&&['failed','error'].includes(s.status),unit:s.unit||p.unit,status:['complete','failed','error','cancelled'].includes(s.status)?s.status:halted(status(p.status))?p.status:s.status||p.status}))}
function row(p){return '<tr><td>'+esc(p.stage||'阶段')+'<small><span class="badge '+status(p.status)+'">'+(p.historicalFailure?'历史中断':label(p.status))+'</span></small>'+(p.historicalFailure?'<small>旧记录，非当前阶段</small>':'')+'</td><td>'+(p.historicalFailure?'中断时<br>':'')+count(p)+'</td><td>'+bar(p)+'<small>'+(pct(p)==null?'—':fmt(Number(pct(p).toFixed(1)))+'%')+'</small></td><td>'+remaining(p)+'</td><td>'+rate(p)+'<small>'+eta(p)+'</small></td></tr>'}
function compactStamp(value,clock=Date.now()){
 const date=new Date(value);if(!value||Number.isNaN(date.getTime()))return '更新待确认';
 const zone={timeZone:'Asia/Shanghai'},today=new Date(clock).toLocaleDateString('en-CA',zone)===date.toLocaleDateString('en-CA',zone);
 return '更新 '+date.toLocaleString('zh-CN',{...zone,...(today?{}:{month:'numeric',day:'numeric'}),hour:'2-digit',minute:'2-digit',second:today?'2-digit':undefined,hour12:false});
}
function summaryStats(p){
 const s=status(p.status),speed=num(p.speed);
 if(s==='complete'||s==='cancelled'||s==='idle')return {speed:null,time:null};
 if(s==='paused')return {speed:null,time:'恢复后重估'};
 if(s==='attention')return {speed:null,time:'进度待核对'};
 if(s==='failed'||s==='error')return {speed:null,time:'暂不可估计'};
 if(pct(p)===100)return {speed:null,time:'等待后续验收'};
 return {speed:speed==null||speed<0?'待测':rate(p),time:pct(p)!=null&&speed>0&&num(p.eta_seconds)!=null&&num(p.eta_seconds)>=0?duration(p.eta_seconds):'待估'};
}
function briefAlert(p,clock=Date.now()){
 const s=status(p.status);if(!['paused','attention','failed','error'].includes(s))return '';
 const updated=Date.parse(p.updated_at);if(s==='attention'&&Number.isFinite(updated)&&clock-updated>90000)return '超过90秒未更新';
 const first=String(p.message||'').split(/[\r\n]/,1)[0].trim();
 if(/^外部进度无法读取/.test(first))return '暂时无法获取进度';
 return first.length>72?first.slice(0,69)+'…':first;
}
function summaryPercent(p){return num(p.done)===0&&num(p.total)===0&&['error','failed','attention'].includes(status(p.status))?null:pct(p);}
function summaryCount(p){return num(p.done)==null||(num(p.done)===0&&num(p.total)===0&&summaryPercent(p)==null)?'等待进度':num(p.total)==null||num(p.total)<0?'已完成 '+fmt(p.done)+' '+esc(p.unit||'项')+' · 总量待确认':fmt(p.done)+' / '+fmt(p.total)+' '+esc(p.unit||'项');}
function summaryMetrics(p){const values=summaryStats(p);return '<div class="summary-metrics">'+(values.speed!=null?'<span class="summary-speed">速度 '+values.speed+'</span>':'')+(values.time!=null?'<span class="summary-eta">'+(status(p.status)==='running'&&pct(p)!==100?'本阶段剩余 ':'')+esc(values.time)+'</span>':'')+'<span class="updated" title="'+esc(stamp(p.updated_at))+'">'+esc(compactStamp(p.updated_at))+'</span></div>';}
const completedStageLimit=8;
function splitStages(p){const visible=[],completed=[];for(const stage of phases(p)){if(stage.status==='complete'&&stage.stage!==p.stage)completed.push(stage);else visible.push(stage);}return {visible,completed};}
function completedStagesExpanded(id,count){return Object.hasOwn(prefs.completedExpanded,id)?prefs.completedExpanded[id]:count<=completedStageLimit;}
function setCompletedStagesExpanded(id,expanded){prefs.completedExpanded[String(id)]=Boolean(expanded);}
function completedRegionId(id){return 'completed-stages-'+encodeURIComponent(id);}
function stageTable(stages){return stages.length?'<div class="tablewrap"><table><thead><tr><th scope="col">阶段</th><th scope="col">已完成 / 总量</th><th scope="col">进度</th><th scope="col">剩余</th><th scope="col">速度 / 预计剩余</th></tr></thead><tbody>'+stages.map(row).join('')+'</tbody></table></div>':'';}
function card(p){
 const s=status(p.status),n=summaryPercent(p),groups=splitStages(p),a=groups.visible,alert=briefAlert(p);const id=String(p.task_id||p.title||''),isPinned=pinned.has(id),expanded=taskExpanded(id);
 return '<article class="card" data-task-id="'+esc(p.task_id||'')+'"><div class="taskhead"><h2>'+esc(p.title||'后台任务')+'</h2><div class="taskactions"><span class="badge '+s+'">'+label(s)+'</span><button type="button" class="pin" data-pin="'+esc(id)+'" aria-pressed="'+isPinned+'" aria-label="'+(isPinned?'取消置顶':'置顶')+'：'+esc(p.title||'后台任务')+'">'+(isPinned?'★ 已置顶':'☆ 置顶')+'</button><span class="move-controls" role="group" aria-label="调整顺序：'+esc(p.title||'后台任务')+'"><button type="button" class="move" data-move="'+esc(id)+'" data-direction="up" aria-label="上移：'+esc(p.title||'后台任务')+'" title="上移">↑</button><button type="button" class="move" data-move="'+esc(id)+'" data-direction="down" aria-label="下移：'+esc(p.title||'后台任务')+'" title="下移">↓</button></span><button type="button" class="detail-toggle" data-detail="'+esc(id)+'" aria-expanded="'+expanded+'" aria-controls="'+esc(detailRegionId(id))+'" aria-label="'+(expanded?'收起详情':'展开详情')+'：'+esc(p.title||'后台任务')+'">'+(expanded?'收起':'详情')+'</button></div></div>'+
 '<p class="summary-hint">'+esc(p.stage||'等待进度')+(s==='running'&&n===100?' · 该阶段完成':'')+'</p><div class="countline"><strong>'+summaryCount(p)+'</strong>'+(n!=null?'<span>'+fmt(Number(n.toFixed(1)))+'% · 剩余 '+remaining(p)+'</span>':'')+'</div>'+(n!=null?bar(p):'')+summaryMetrics(p)+(alert?'<p class="alert-note">'+esc(alert)+'</p>':'')+
 stageTable(a)+
 (p.message?'<p class="message">'+esc(p.message)+'</p>':!a.length&&!groups.completed.length?'<p class="detail-empty">尚无阶段明细。</p>':'')+'</article>';
}

const prefsKey='global-task-progress-ui-v1';
const sortModes=new Set(['updated','attention','progress','name','manual']);
const ended=new Set(['complete','failed','cancelled','idle']);
function normalizeOrder(value){return Array.isArray(value)?[...new Set(value.filter(id=>typeof id==='string'))]:[];}
function normalizeRefreshSeconds(value){if(typeof value!=='number'&&typeof value!=='string')return null;if(typeof value==='string'&&!value.trim())return null;const seconds=Number(value);return Number.isInteger(seconds)&&seconds>=1&&seconds<=300?seconds:null;}
function staleTask(task,clock=Date.now()){
 if(task.status!=='running')return task;
 const updated=Date.parse(task.updated_at);
 if(Number.isFinite(updated)&&clock-updated<=90000)return task;
 return {...task,status:'attention',speed:null,eta_seconds:null,message:(task.message||'')+'；本页记录超过90秒或更新时间无效，停止旧速度/ETA，等待下一次刷新。'};
}
function normalizeExpanded(value){const result=Object.create(null);if(value&&typeof value==='object'&&!Array.isArray(value))for(const [id,expanded] of Object.entries(value))if(typeof expanded==='boolean')result[id]=expanded;return result;}
let prefs={sort:'updated',pins:[],order:[],refreshSeconds:2,compact:true,expanded:Object.create(null),completedExpanded:Object.create(null),viewVersion:2},savedPrefs=true,resetDetailPrefs=false;
try{const old=JSON.parse(localStorage.getItem(prefsKey)||'{}');if(sortModes.has(old.sort))prefs.sort=old.sort;if(Array.isArray(old.pins))prefs.pins=old.pins.filter(id=>typeof id==='string');if(normalizeRefreshSeconds(old.refreshSeconds)!=null)prefs.refreshSeconds=normalizeRefreshSeconds(old.refreshSeconds);if(old.viewVersion===2){if(typeof old.compact==='boolean')prefs.compact=old.compact;prefs.expanded=normalizeExpanded(old.expanded);}else resetDetailPrefs=true;prefs.order=normalizeOrder(old.order);prefs.completedExpanded=normalizeExpanded(old.completedExpanded);}catch{savedPrefs=false;}
const pinned=new Set(prefs.pins);
let manualRanks=new Map(prefs.order.map((id,index)=>[id,index]));
let lastTasks=[];
function savePrefs(){try{localStorage.setItem(prefsKey,JSON.stringify({sort:prefs.sort,pins:[...pinned],order:prefs.order,refreshSeconds:prefs.refreshSeconds,compact:prefs.compact,expanded:prefs.expanded,completedExpanded:prefs.completedExpanded,viewVersion:2}));savedPrefs=true;}catch{savedPrefs=false;}}
if(resetDetailPrefs)savePrefs();
function detailRegionId(id){return 'task-details-'+encodeURIComponent(id);}
function taskExpanded(id){return Object.hasOwn(prefs.expanded,id)?prefs.expanded[id]:!prefs.compact;}
function setTaskExpanded(id,expanded){prefs.expanded[String(id)]=Boolean(expanded);}
function setAllTasksExpanded(expanded){prefs.compact=!expanded;prefs.expanded=Object.create(null);}
function compareRows(a,b){
 const pin=Number(pinned.has(b.id))-Number(pinned.has(a.id));if(pin)return pin;
 let order=0;
 if(prefs.sort==='manual')order=(manualRanks.get(a.id)??Infinity)-(manualRanks.get(b.id)??Infinity);
 else if(prefs.sort==='attention'){const rank={error:0,failed:0,attention:1,paused:2,running:3,complete:4,cancelled:5,idle:6};order=(rank[a.task.status]??1)-(rank[b.task.status]??1);}
 else if(prefs.sort==='progress')order=(pct(a.task)??-1)-(pct(b.task)??-1);
 else if(prefs.sort==='name')order=String(a.task.title||'').localeCompare(String(b.task.title||''),'zh-CN');
 if(prefs.sort==='updated'||(prefs.sort==='manual'&&Number.isNaN(order)))order=(num(b.task.updated_ts)||Date.parse(b.task.updated_at)||0)-(num(a.task.updated_ts)||Date.parse(a.task.updated_at)||0);
 return order||String(a.task.title||a.id).localeCompare(String(b.task.title||b.id),'zh-CN')||a.id.localeCompare(b.id);
}
function setManualOrder(ids){prefs.order=normalizeOrder(ids);manualRanks=new Map(prefs.order.map((id,index)=>[id,index]));}
function orderedRows(tasks){
 const rows=tasks.map((task,index)=>({task,id:String(task.task_id||task.title||'task-'+index)}));
 if(prefs.sort==='manual'){
  const added=rows.filter(row=>!manualRanks.has(row.id)).sort(compareRows);
  if(added.length){setManualOrder([...prefs.order,...added.map(row=>row.id)]);savePrefs();}
 }
 return rows.sort(compareRows);
}
function moveNeighbors(rows){
 const groups=new Map(),neighbors=new Map();
 for(const row of rows){const group=(ended.has(row.task.status)?'history':'current')+':'+pinned.has(row.id);if(!groups.has(group))groups.set(group,[]);groups.get(group).push(row);}
 for(const group of groups.values())for(let index=0;index<group.length;index++)neighbors.set(group[index].id,{up:group[index-1]?.id,down:group[index+1]?.id});
 return neighbors;
}
function moveTask(tasks,id,direction){
 if(!['up','down'].includes(direction))return false;
 const rows=orderedRows(tasks),target=moveNeighbors(rows).get(id)?.[direction];if(target==null)return false;
 const order=prefs.sort==='manual'?[...prefs.order]:normalizeOrder([...rows.map(row=>row.id),...prefs.order]),from=order.indexOf(id),to=order.indexOf(target);
 [order[from],order[to]]=[order[to],order[from]];setManualOrder(order);prefs.sort='manual';return true;
}
function overviewCounts(tasks){return {total:tasks.length,running:tasks.filter(task=>status(task.status)==='running').length,waiting:tasks.filter(task=>['paused','attention','error','failed'].includes(status(task.status))).length,complete:tasks.filter(task=>status(task.status)==='complete').length};}
function renderOverviewCounts(tasks){const counts=overviewCounts(tasks);ui.overview.innerHTML=[['任务总数',counts.total],['进行中',counts.running],['暂停 / 待核对 / 异常',counts.waiting],['已完成',counts.complete]].map(([name,value])=>'<div class="tile"><span>'+name+'</span><strong>'+fmt(value)+'</strong></div>').join('');}
function displayTasks(tasks){
 lastTasks=tasks;
 renderOverviewCounts(tasks);
 const rows=orderedRows(tasks);
 const current=rows.filter(row=>!ended.has(row.task.status)),history=rows.filter(row=>ended.has(row.task.status));
 renderList(ui.currentTasks,current);renderList(ui.historyList,history);
 const present=new Set(rows.map(row=>row.id));for(const id of cards.keys())if(!present.has(id))cards.delete(id);
 ui.currentTitle.textContent='当前任务（'+current.length+'）';ui.emptyCurrent.hidden=!!current.length;ui.emptyCurrent.textContent='当前没有未结束的任务。';
 ui.historyTasks.hidden=!history.length;ui.historySummary.textContent='历史任务（'+history.length+'）';
 const count=rows.filter(row=>pinned.has(row.id)).length;
 el('pinHint').textContent='已置顶 '+count+' 个'+(prefs.sort==='manual'?' · 手动顺序已保存':'')+(savedPrefs?'':' · 偏好仅在本次页面有效');
 el('clearPins').disabled=!pinned.size;
}

const cards=new Map();
const ui=Object.fromEntries(['panels','error','overview','currentTitle','currentTasks','emptyCurrent','historyTasks','historySummary','historyList','stamp'].map(id=>[id,document.getElementById(id)]));
let loading=false;
function renderCard(p,id){
 let node=cards.get(id);
 if(!node){
  node=document.createElement('article');node.className='card';node.dataset.taskId=id;
  node.innerHTML='<div class="task-overview"></div><div class="task-details"><details class="stages" open><summary>子任务进度</summary><div class="stage-list"></div><div class="completed-stages" hidden><button type="button" class="completed-toggle"></button><div class="completed-list" hidden></div></div></details><div class="task-extra"></div></div>';
  node.querySelector('.task-details').id=detailRegionId(id);
  cards.set(id,node);
 }
 const template=document.createElement('template');template.innerHTML=card(p);
 const next=template.content.firstElementChild,table=next.querySelector('.tablewrap'),grouping=splitStages(p);
 const nextHead=next.querySelector('.taskhead'),head=node.querySelector(':scope > .taskhead');
 if(!head)node.insertBefore(nextHead,node.firstChild);
 else{
  head.querySelector('h2').textContent=nextHead.querySelector('h2').textContent;
  const badge=head.querySelector('.badge'),nextBadge=nextHead.querySelector('.badge');badge.className=nextBadge.className;badge.textContent=nextBadge.textContent;
  const pin=head.querySelector('.pin'),nextPin=nextHead.querySelector('.pin');pin.textContent=nextPin.textContent;for(const attr of ['data-pin','aria-pressed','aria-label'])pin.setAttribute(attr,nextPin.getAttribute(attr));
  const toggle=head.querySelector('.detail-toggle'),nextToggle=nextHead.querySelector('.detail-toggle');toggle.textContent=nextToggle.textContent;for(const attr of ['data-detail','aria-expanded','aria-controls','aria-label'])toggle.setAttribute(attr,nextToggle.getAttribute(attr));
  head.querySelector('.move-controls').setAttribute('aria-label',nextHead.querySelector('.move-controls').getAttribute('aria-label'));
  for(const direction of ['up','down']){const move=head.querySelector('[data-direction="'+direction+'"]'),nextMove=nextHead.querySelector('[data-direction="'+direction+'"]');for(const attr of ['data-move','aria-label'])move.setAttribute(attr,nextMove.getAttribute(attr));}
  nextHead.remove();
 }
 node.classList.toggle('is-compact',!taskExpanded(id));
 node.querySelector('.task-extra').replaceChildren(...next.querySelectorAll('.message,.detail-empty'));
 next.querySelector('.phasecount')?.remove();table?.remove();
 node.querySelector('.task-overview').replaceChildren(...next.childNodes);
 const details=node.querySelector('.stages');details.hidden=!table&&!grouping.completed.length;
 details.querySelector('.stage-list').replaceChildren(...(table?[table]:[]));
 const completed=details.querySelector('.completed-stages'),button=completed.querySelector('.completed-toggle'),list=completed.querySelector('.completed-list');
 completed.hidden=!grouping.completed.length;
 const expanded=completedStagesExpanded(id,grouping.completed.length);
 button.dataset.completed=id;button.setAttribute('aria-expanded',String(expanded));button.setAttribute('aria-controls',completedRegionId(id));
 button.setAttribute('aria-label',(expanded?'收起':'展开')+'已完成子任务（'+grouping.completed.length+'）：'+(p.title||'后台任务'));
 button.textContent=(expanded?'▾':'▸')+' 已完成子任务（'+grouping.completed.length+'） · '+(expanded?'收起':'展开');
 list.id=completedRegionId(id);list.hidden=!expanded;list.innerHTML=stageTable(grouping.completed);
 return node;
}
function renderList(container,rows){
 const wanted=new Set(rows.map(row=>row.id)),neighbors=moveNeighbors(rows);let cursor=container.firstElementChild;
 for(const row of rows){const node=renderCard(row.task,row.id);for(const direction of ['up','down']){const button=node.querySelector('[data-direction="'+direction+'"]');button.disabled=neighbors.get(row.id)[direction]==null;button.title=button.disabled?(direction==='up'?'已在本组最前':'已在本组最后'):'在本组'+(direction==='up'?'上移':'下移')+'一位';}if(node===cursor)cursor=cursor.nextElementSibling;else container.insertBefore(node,cursor);}
 for(const node of Array.from(container.children))if(!wanted.has(node.dataset.taskId))node.remove();
}
async function tick(){
 if(loading)return;loading=true;
 try{
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),8000);let response;
  try{response=await fetch('/api/tasks',{cache:'no-store',signal:controller.signal});}finally{clearTimeout(timeout)}
  if(!response.ok)throw Error('统一进度服务不可读取');const snapshot=await response.json();
  if(!Array.isArray(snapshot.tasks))throw Error('任务列表格式无效');
  const observed=Date.parse(snapshot.observed_at||snapshot.updated_at);
  if(!Number.isFinite(observed)||Date.now()-observed>90000)throw Error('进度来源超过90秒未刷新');
  const tasks=snapshot.tasks.map(task=>staleTask(task));
  displayTasks(tasks);
  ui.panels.hidden=false;ui.overview.hidden=false;ui.error.hidden=true;
  el('connection').className='live';el('connection').textContent=prefs.refreshSeconds+' 秒刷新';
  ui.stamp.textContent='页面刷新：'+stamp(new Date().toISOString())+' · 数据采样：'+stamp(snapshot.observed_at||snapshot.updated_at);
 }catch(error){
  // Preserve the existing task nodes and expansion state across refreshes and outages.
  ui.panels.hidden=true;ui.overview.hidden=true;ui.error.hidden=false;ui.error.textContent=(error.name==='AbortError'?'获取进度超时':error.message)+'，正在重试。';
  el('connection').className='live error';el('connection').textContent='连接中断';
 }finally{loading=false;}
}
el('progressEndpoint').textContent=location.host;
el('taskSort').value=prefs.sort;
el('taskSort').addEventListener('change',event=>{prefs.sort=sortModes.has(event.target.value)?event.target.value:'updated';savePrefs();displayTasks(lastTasks);});
ui.panels.addEventListener('click',event=>{const completed=event.target.closest('button[data-completed]');if(completed){const id=completed.dataset.completed;setCompletedStagesExpanded(id,completed.getAttribute('aria-expanded')!=='true');savePrefs();displayTasks(lastTasks);cards.get(id)?.querySelector('.completed-toggle').focus({preventScroll:true});return;}const move=event.target.closest('button[data-move]');if(move){const id=move.dataset.move,direction=move.dataset.direction;if(move.disabled||!moveTask(lastTasks,id,direction))return;savePrefs();el('taskSort').value=prefs.sort;displayTasks(lastTasks);const card=cards.get(id);(card.querySelector('button[data-direction="'+direction+'"]:not(:disabled)')||card.querySelector('button.move:not(:disabled)')||card.querySelector('.detail-toggle')).focus({preventScroll:true});return;}const detail=event.target.closest('button[data-detail]');if(detail){const id=detail.dataset.detail;setTaskExpanded(id,!taskExpanded(id));savePrefs();displayTasks(lastTasks);document.querySelector('button[data-detail="'+CSS.escape(id)+'"]')?.focus({preventScroll:true});return;}const button=event.target.closest('button[data-pin]');if(!button)return;const id=button.dataset.pin;if(pinned.has(id))pinned.delete(id);else pinned.add(id);savePrefs();displayTasks(lastTasks);document.querySelector('button[data-pin="'+CSS.escape(id)+'"]')?.focus({preventScroll:true});});
el('clearPins').addEventListener('click',()=>{pinned.clear();savePrefs();displayTasks(lastTasks);});

let refreshTimer;
function restartRefreshTimer(){clearInterval(refreshTimer);refreshTimer=setInterval(tick,prefs.refreshSeconds*1000);if(!el('connection').classList.contains('error'))el('connection').textContent=prefs.refreshSeconds+' 秒刷新';}
el('refreshSeconds').value=prefs.refreshSeconds;
el('refreshForm').addEventListener('submit',event=>{event.preventDefault();const input=el('refreshSeconds'),seconds=normalizeRefreshSeconds(input.value);if(seconds==null){input.reportValidity();return;}prefs.refreshSeconds=seconds;savePrefs();restartRefreshTimer();tick();});
el('expandAllTasks').addEventListener('click',()=>{setAllTasksExpanded(true);savePrefs();displayTasks(lastTasks);for(const node of cards.values())node.querySelector('.stages').open=true;});
el('collapseAllTasks').addEventListener('click',()=>{setAllTasksExpanded(false);savePrefs();displayTasks(lastTasks);});
// Client-only expiry check: no HTTP or shell requests, even with a long refresh interval.
setInterval(()=>{const tasks=lastTasks.map(task=>staleTask(task));if(tasks.some((task,index)=>task!==lastTasks[index])){displayTasks(tasks);}},1000);

tick();restartRefreshTimer();

</script></body></html>
